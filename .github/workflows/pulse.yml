# The outside witness. Public repo → Actions minutes are free, so this can
# afford to run every five minutes forever. Each run commits pulse.json, which
# both archives uptime history in git and keeps the repo active so GitHub
# never disables the schedule. A red run = a real probe failure = GitHub
# emails the owner, with no billing failure mode able to fake it.
name: pulse
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe every public surface
        env:
          PULSE_HMAC_SECRET: ${{ secrets.PULSE_HMAC_SECRET }}
          DECK_ORIGIN: ${{ vars.DECK_ORIGIN }}
          AUTH_HEALTH_URL: ${{ vars.AUTH_HEALTH_URL }}
          AUTH_ANON_KEY: ${{ vars.AUTH_ANON_KEY }}
        run: node probe.mjs
      - name: Archive the result
        if: always()
        run: |
          git config user.name "pulse"
          git config user.email "pulse@users.noreply.github.com"
          git add pulse.json
          git diff --cached --quiet || git commit -m "pulse $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
